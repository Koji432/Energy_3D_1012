<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e8eee8">
<title>原子力発電 3D</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=20261013-1">
<script defer src="./app.bundle.js?v=20261013-1"></script>
</head>
<body>
<main id="scene-wrap">
<canvas id="scene" tabindex="0" aria-label="原子力発電の3Dモデル。ドラッグで回転、ピンチまたはホイールで拡大縮小。矢印キーとプラス・マイナスキーでも操作できます。"></canvas>
<div id="loading" role="status" aria-label="3Dモデルを読み込んでいます"><span></span></div>
<header class="plant-title"><h1>原子力発電 <span>3D</span></h1><p id="type-summary">一次系と二次系を分けて熱を伝える</p></header>
<div class="reactor-controls glass" role="group" aria-label="原子炉の方式">
<button data-reactor="pwr" class="active" aria-pressed="true">PWR <small>加圧水型</small></button>
<button data-reactor="bwr" aria-pressed="false">BWR <small>沸騰水型</small></button>
</div>
<nav class="view-controls glass" aria-label="表示方法">
<button data-mode="outside" aria-pressed="false">外観</button>
<button data-mode="cutaway" class="active" aria-pressed="true">内部</button>
</nav>
<div class="camera-controls glass">
<button id="reset-camera" title="全体を見る" aria-label="全体を見る"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4M8 12h8m-4-4v8"/></svg></button>
<button id="zoom-in" title="拡大" aria-label="拡大"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
<button id="zoom-out" title="縮小" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
<button id="fullscreen" title="全画面" aria-label="全画面"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
</div>
<div class="playback glass" aria-label="アニメーション操作">
<div class="playback-row">
<button id="start" class="start"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><span>スタート</span></button>
<button id="pause" class="square" disabled aria-label="一時停止" title="一時停止"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
<span class="control-divider"></span>
<select id="speed" aria-label="再生速度" title="再生速度"><option value="0.5">0.5 ×</option><option value="1" selected>1 ×</option><option value="2">2 ×</option></select>
<button id="follow" class="square active" aria-pressed="true" aria-label="流れにカメラを追従" title="流れにカメラを追従"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="reset" class="square" aria-label="最初の停止状態に戻す" title="最初の停止状態に戻す"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1 0 7M5 4v5h5"/></svg></button>
</div>
<input id="timeline" type="range" min="0" max="30" value="0" step="0.01" aria-label="アニメーションの位置" disabled>
</div>
<div id="labels" aria-label="設備名"></div>
<div class="utility-controls"><button id="toggle-labels" class="glass" aria-pressed="true">設備名</button></div>
<div class="legend" aria-label="流れの色"><span id="primary-key"><i style="--dot:#bd7196"></i>一次冷却水</span><span><i style="--dot:#dd9c54"></i>蒸気</span><span><i style="--dot:#4a94bd"></i>復水・給水</span><span><i style="--dot:#56a99e"></i>冷却用海水</span></div>
</main>
<noscript><p>JavaScriptを有効にしてください。</p></noscript>
</body></html>
